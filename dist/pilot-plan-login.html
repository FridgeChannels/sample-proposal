<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot Plan Access</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #2a2f3a;
      --accent: #c8ff00;
      --danger: #f87171;
      font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1a2030 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: color-mix(in oklab, var(--panel) 92%, black);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0d1016;
      color: var(--text);
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: color-mix(in oklab, var(--accent) 55%, white);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
    }
    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #111;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 14px 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .error {
      min-height: 1.2rem;
      margin-top: 12px;
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pilot Plan Access</h1>
    <p>Enter the team access key to open prep and meeting tools. Your browser will remember it until cookies are cleared.</p>
    <form id="login-form">
      <label for="password">Access key</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="submit-btn">Continue</button>
      <div class="error" id="error" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('return') || '/pilot-plan/prep';
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('/api/pilot-plan/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed.');
        }
        window.location.replace(returnTo.startsWith('/') ? returnTo : '/pilot-plan/prep');
      } catch (error) {
        errorEl.textContent = error.message || 'Authentication failed.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
