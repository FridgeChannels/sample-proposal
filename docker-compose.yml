services:
  proposal:
    build:
      context: .
      args:
        VITE_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_POSTHOG_SESSION_REPLAY: ${VITE_POSTHOG_SESSION_REPLAY:-}
        VITE_LEGAL_DOCS_BASE_URL: ${VITE_LEGAL_DOCS_BASE_URL:-}
    image: sample-proposal:latest
    container_name: sample-proposal
    ports:
      # localhost only — Caddy (sample.hommio.ai) reverse_proxies here.
      # Host 4174 avoids clashing with local .env PORT=4173.
      - "127.0.0.1:4174:4173"
    # Classic string form — older docker-compose (v1) rejects path/required objects.
    env_file:
      - .env
    environment:
      # App listens on 4173 inside the container only
      PORT: "4173"
    restart: unless-stopped
